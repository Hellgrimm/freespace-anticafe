<div class="modal" id="loginModal" style="display: none;">
    <div class="modal-content">
        <div class="login-wrap">
            <div class="login-html">
                <span class="close-button" onClick="hideLoginModal();">×</span>
                <input id="tab-1" type="radio" name="tab" class="sign-in" checked><label for="tab-1" class="tab">Sign In</label>
                <input id="tab-2" type="radio" name="tab" class="sign-up"><label for="tab-2" class="tab">Sign Up</label>
                <div class="login-form">
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="sign-in-htm">
                            <div class="group">
                                <label for="email" class="label">Email</label>
                                <input id="email" type="text" class="input">
                            </div>
                            <div class="group">
                                <label for="pass" class="label">Password</label>
                                <input id="pass" type="password" class="input" data-type="password">
                            </div>
                            <div class="group">
                                <input id="check" type="checkbox" class="check" checked>
                                <label for="check"><span class="icon"></span> Keep me Signed in</label>
                            </div>
                            <div class="group">
                                <input type="submit" class="button" value="Sign In">
                            </div>
                            <div class="hr"></div>
                            <div class="foot-lnk">
                                <a href="#forgot">Forgot Password?</a>
                            </div>
                        </div>
                    </form>
                    <form id="registerForm" onsubmit="handleRegister(event) ">
                        <div class="sign-up-htm">
                            <div class="group">
                                <label for="reg-user" class="label">Username</label>
                                <input id="reg-user" type="text" class="input">
                            </div>
                            <div class="group">
                                <label for="reg-pass" class="label">Password</label>
                                <input id="reg-pass" type="password" class="input">
                            </div>
                            <div class="group">
                                <label for="reg-repeat-pass" class="label">Repeat Password</label>
                                <input id="reg-repeat-pass" type="password" class="input">
                            </div>
                            <div class="group">
                                <label for="reg-email" class="label">Email Address</label>
                                <input id="reg-email" type="text" class="input">
                            </div>
                            <div class="group">
                                <input type="submit" class="button" value="Sign Up">
                            </div>
                        </div>
                        
                    </form>                    
                </div>
            </div>
        </div>
    </div>
</div>
